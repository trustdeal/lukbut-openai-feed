name: Update OpenAI product feed

on:
  workflow_dispatch:

  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert IdoSell XML to OpenAI CSV
        env:
          IDOSELL_FEED_URL: ${{ secrets.IDOSELL_FEED_URL }}
        run: python convert_feed.py

      - name: Show generated file
        run: |
          ls -lh public/products.csv
          wc -l public/products.csv

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
